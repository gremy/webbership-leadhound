# NOT LEGAL ADVICE. Country rules for cold email and calls to businesses, from the plan's own four research passes of 27 Oct 2026 (US/CA/UK; western and northern EU; southern and eastern EU; AU/NZ).
# Entries marked secondary or unverified are leads for a lawyer, not settled law; operator_decision entries were opened by the operator (27 Oct 2026; CH on 28 Oct 2026) and carry the reason in `acknowledge`.
#
# Closed vocabularies (enforced when the file loads):
#   email.verdict / call.verdict: open | published_address | role_address_only | consent | off | hold
#   individuals.email / individuals.call: same (as companies) | consent | off
#   confidence: verified (read on the primary page) | secondary | unverified | operator_decision
#   group: both_open | call_first | off | operator_opened | call_first_operator
# A register's max_age_days of 0 means the research named no age: screen before each campaign.
# A country with region_required (US, CA, AU) is callable only when the lead's region is known; the window is then computed in the region's time zone.

research_date: 2026-10-27

# The calling hours where the law names none: the business window CP3 already used (09:30-17:00, Mon-Fri, the callee's time).
default_call_windows:
  - {days: [Mon, Tue, Wed, Thu, Fri], start: "09:30", end: "17:00"}

registers:
  tps: {country: GB, name: Telephone Preference Service, max_age_days: 28}
  ctps: {country: GB, name: Corporate Telephone Preference Service, max_age_days: 28}
  dncm: {country: BE, name: Do Not Call Me, max_age_days: 3}
  ndd: {country: IE, name: National Directory Database, max_age_days: 0}
  dncr: {country: AU, name: Do Not Call Register, max_age_days: 0}
  rpo: {country: IT, name: Registro pubblico delle opposizioni, max_age_days: 0}
  robinson: {country: ES, name: Lista Robinson, max_age_days: 0}
  gr_art11: {country: GR, name: Article 11 registers, max_age_days: 0}

# Words that mark a business as a natural person (a sole trader) on its own pages.
sole_trader_words: [sole trader, sole proprietor, self-employed, Einzelunternehmen, Einzelunternehmer, eingetragener Kaufmann, entrepreneur individuel, auto-entrepreneur, micro-entrepreneur, eenmanszaak, enskild firma, toiminimi, ditta individuale, Einzelfirma, raison individuelle, autónomo, empresario individual, PFA, persoană fizică autorizată, întreprindere individuală, enkeltmandsvirksomhed, jednoosobowa działalność, empresário em nome individual]

