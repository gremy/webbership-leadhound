# cafe@1 signal list: what on a café's own homepage counts as digital loyalty, online
# ordering or Instagram. Data, not code: add a vendor or a phrase here and the detector
# picks it up (DefaultConfig embeds this file).
#
# vendors[].match: "host" or "host/path-prefix". A link, script, iframe, stylesheet or form
#   on that host (or a subdomain), with that path prefix when given, is a match; so is the
#   text "host/path" inside an inline script (a widget loader).
# vendors[].own: true marks Webbership itself: a café already on it is a customer, never a lead.
#   The own vendor is not listed here: its hosts come from the operator's private config at
#   run time (Config.WithOwnVendor), since this repository never names the live domain.
# words[].phrases: matched case-insensitively in the page's visible text, as whole words,
#   runs of spaces folded. Phrases are evidence of the weaker kind ("via word").
# place_words.roastery: words in a business's name that suggest a roastery rather than a café,
#   matched case- and diacritic-insensitively as whole words. A name is the weakest source of a
#   place type, so words that also catch cafés (roasted, shop, magazin) are left out.
# instagram.coffee_words (coffee-words@1): the prefilter for a following list's accounts. An
#   account is kept when a word appears anywhere inside its handle or its name, both lower case
#   with every accent mark dropped. The /ig-signals skill's snippets carry the same list under a
#   contract test, so change both together. "barista" is left out: it names people (a barista's
#   own account), and a kept account's name is stored.
# vendors[].ig_words: words that name a loyalty vendor on Instagram with no @-tag or link (Toto
#   Café's "PICK"). A word counts only as a whole word, case-sensitive, and only when the same
#   bio or caption also holds a word starting with one of instagram.loyalty_cues ("via word").
# instagram.loyalty_cues: lower-case ASCII word starts, matched against the bio or caption with
#   accents dropped and lower case (so "recompens" catches "recompensă", "reward" "rewards").
# instagram.prepaid_words: a prepaid offer (a coffee subscription or bundle) in the bio or a
#   caption; whole words, accents dropped, lower case.
# instagram.question_cues: a comment that asks (price, info, a demo); whole words, accents
#   dropped, lower case. A "?" in a comment counts too (the intent rules apply that).
instagram:
  coffee_words: [cafe, caffe, coffee, cafea, cafenea, kafe, kaffee, espresso, roast, prajit, brew, specialty, speciality]
  loyalty_cues: [partener, partner, puncte, points, recompens, reward, fidelitate, loyalty, card, aplicati, app, cupon, coupon]
  prepaid_words: [abonament, subscription, prepaid, preplatit, bundle]
  question_cues: [cat, pret, pretul, price, cost, costa, info, detalii, details, dm, cum, how, demo, oferta]

place_words:
  roastery:
    - roastery
    - roasters
    - coffee roaster
    - prăjitorie
    - prăjitoria
    - microprăjitorie
    - torrefazione

