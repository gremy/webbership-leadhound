# A fictional campaign spec for café owners: a white-label Apple/Google Wallet stamp card (leadhound leads campaigns ...).
# Copy examples/campaigns/ into your LEADHOUND_DATA_DIR and make it your own; every value here is a demo.
# Kept out of this file on purpose, in your data dir only: your real proof line, the names of the cafés that run on
# your product (sender facts, verbatim), and your own product's hosts (leads.yaml probe.cafe_own_vendor_hosts),
# so a café already on it is never written to.
slug: cafes-loyalty
name: Café loyalty cards
product: {name: Demo Loyalty, site_url: "https://sender.example/"}
source:
  kind: overture # Overture Maps Places, exported to NDJSON with DuckDB (README "Café places")
  categories: [coffee_shop, cafe] # Overture primary categories kept
  countries: [GB, IE, US, RO, IT, ES] # places outside these are skipped at import
  min_confidence: 0.7 # Overture's confidence below which a place is skipped
chains:
  max_locations: 5 # one name or one website on more places than this, in one import, is a chain
  names: [Demo Coffee Chain] # chains you know by name (also matched as a name's first words)
  keep_branded: false # a place Overture lists under a brand is a chain unless this is true
detectors: [cafe@1]
# Kinds on, each with its own templates: a café with a website and no digital loyalty on it; a café already on
# another loyalty platform (the email can name the vendor: the VendorName and VendorLink slots); a café with no site
# of its own, reached on the email or phone its Overture place lists.
kinds: [cafe_no_digital_loyalty, cafe_has_loyalty, cafe_no_website]
countries: # country -> policy; a country missing here gets no email and no call
  GB: {email: on, call: on, lang: en, footer: footer-cafe-en} # footer: this campaign's own footers/<name>.txt, from leads.yaml's templates dir; without it, leads.yaml's footer for the country
  IE: {email: on, call: off, lang: en}
  US: {email: on, call: on, lang: en} # calls need the café's state: the place import stores it
  # Every country runs the same email-first sequence below. Write it/ and es/ templates before writing to Italy and Spain in their language.
  # identity_line and opt_out_line: this campaign's own wording of leads.yaml's sender.identity_line and
  # sender.opt_out_lines.<lang> for the country (here the informal "tu"); one line each, email on only, and the
  # opt-out line must hold an opt-out word (dezabonare, unsubscribe…). Every email must still carry both.
  RO: {email: on, call: on, lang: ro, identity_line: "Demo SRL, Strada Exemplu 1, Orașul Exemplu", opt_out_line: "Nu e momentul potrivit? Răspunde cu „dezabonare” și nu îți mai scriu."}
  IT: {email: on, call: on, lang: en}
  ES: {email: on, call: on, lang: en}
batches_from: starred_then_rest # optional: starred | starred_then_rest; wins over leads.yaml's batches_from and the console's setting for this campaign's batches
writer: template # template | claude (claude is refused until the draft gate passes)
offer:
  proof_line: "I built Demo Loyalty and run it at my own café." # one true line, used verbatim; yours goes in your data dir
  magnet: live_demo # a real card in their own Wallet, sent when they reply
  # Claude drafts only: the closed list of pains a draft may name, keyed by the lead's kind.
  pains:
    - {id: paper_cards, needs: [kind == cafe_no_digital_loyalty], text: "Paper stamp cards get lost or forgotten, and every print run costs money."}
    - {id: regulars_unknown, needs: [kind == cafe_no_digital_loyalty], text: "Rewards nobody tracks, so there is no telling whether regulars come back."}
    - {id: platform_brand, needs: [kind == cafe_has_loyalty], text: "Some platforms put their own brand on the card and keep features for the dearer plans."}
    - {id: no_site_signup, needs: [kind == cafe_no_website], text: "Customers sign up from a QR code at the counter, so no website is needed."}
  call_to_action: "Worth 10 minutes to see it on your phone?" # the closing question, verbatim
  links: ["https://demo.example/"] # URLs an email may carry beside product.site_url: absolute https, at most 10
  # cafe@1 only: a café's loyalty vendor id (internal/cafe/signals.yaml) -> the page the VendorLink slot carries;
  # default is used for a vendor with no entry of its own. Templates test the slots: {{if .VendorName}}…{{else}}…{{end}}.
  vendor_links:
    stampino: "https://compare.example/vs/stampino"
    stampme: "https://compare.example/vs/stamp-me"
    default: "https://compare.example/vs"
copy:
  banned_words: [synergy, guarantee, revolutionary]
  max_words: {0: 125, 1: 80, 3: 60, 4: 60} # default sequence: step -> most words above the footer
  max_words_by_sequence: {call_first: {2: 110, 3: 60}} # the call-first sequence's own limits
  links_in_step0: false # the first email holds no link: they reply to get the demo; the follow-up carries it
  exclamation: false
  # Claude drafts only: the grounding check's rules (internal/outreach/ground.go).
  allowed_names: [Demo Loyalty, Demo, Sender, Apple Wallet, Google Wallet, Wallet] # add your own name, product and cafés in your data dir
  research_openers: ['(?i)\bI (noticed|saw|came across|was looking at)\b', '(?i)\byour (site|website|menu)\b']
  inflation_words: [dozens, hundreds, many cafés, countless, leading, top, best, award]
  echo_words: 6
sequence:
  - {step: 0, type: email}
  - {step: 1, type: email, after_business_days: 3}
  - {step: 2, type: call, after_business_days: 2, when: has_callable_phone}
  - {step: 3, type: email, after_business_days: 1, when: call_not_connected}
  - {step: 4, type: email, after_business_days: 5}
templates_dir: templates # <kind>/<lang>/{0,1,3,4}.txt and call.txt; call-first leads get <kind>/<lang>/call_first/{2,3}.txt;
# a form lead (a contact form, no address) gets <kind>/<lang>/form.txt and linkedin.txt, both required for a café kind
