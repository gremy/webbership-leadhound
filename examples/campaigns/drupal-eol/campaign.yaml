# A fictional campaign spec for the Drupal end-of-life outreach (leadhound leads campaigns ...).
# Copy examples/campaigns/ into your LEADHOUND_DATA_DIR and make it your own; every value here is a demo.
# The templates are the fallback the template writer sends; your real copy is yours to write and approve.
slug: drupal-eol
name: Drupal end-of-life
product: {name: Drupal upgrades, site_url: "https://sender.example/"}
source: {kind: site_list}
detectors: [drupal@1, agency@1]
kinds: [unsupported, d10, agency_partner]
countries: # country -> policy; a country missing here gets no email and no call
  GB: {email: on, call: on, lang: en}
  IE: {email: on, call: off, lang: en}
  US: {email: on, call: off, lang: en}
  DE: {email: off, call: off}
writer: template # template | claude (claude is refused until the draft gate passes)
offer:
  proof_line: "Recently I took a Drupal 7 site for Harbour Lane Studio to Drupal 10, with no downtime." # one true line, used verbatim
  magnet: upgrade_risk_report # the free one-page upgrade-risk report, offered in step 0 and sent on reply
  # Claude drafts only: the closed list of pains a draft may name. Code picks the ones a lead's stored
  # signals allow (needs: finding.major in A..B, finding.major == N, kind == X; every need must hold);
  # Claude may reword a chosen pain, never invent one. The texts follow the approved templates.
  pains:
    - {id: eol_no_security, needs: [kind == unsupported, finding.major in 6..9], text: "Security support for this Drupal version has ended, so new security holes stay open."}
    - {id: modules_unfixed, needs: [kind == unsupported, finding.major in 6..9], text: "Modules no longer get fixes, so small faults pile up."}
    - {id: php_hosting, needs: [kind == unsupported, finding.major in 6..9], text: "Newer PHP versions will not run the old code, so hosting gets harder."}
    - {id: d7_migration, needs: [kind == unsupported, finding.major in 6..7], text: "Moving off this version is a migration to a new build, not an in-place update, and it gets harder the longer it waits."}
    - {id: d10_eol, needs: [kind == d10, finding.major == 10], text: "Security support for this version ends soon; after that, new security holes stay open."}
    - {id: d10_modules, needs: [kind == d10, finding.major == 10], text: "Some modules need new versions for the next major release, and a few have none yet."}
    - {id: d10_php, needs: [kind == d10, finding.major == 10], text: "The next major release also needs newer PHP, so hosting may change too."}
    - {id: agency_waves, needs: [kind == agency_partner], text: "Upgrades tend to arrive together, when several clients hit an end-of-life date at once."}
    - {id: agency_weeks, needs: [kind == agency_partner], text: "They are slow, careful work that ties up a team for weeks."}
    - {id: agency_quote, needs: [kind == agency_partner], text: "A fixed price is hard to quote before anyone has looked inside the site."}
  report: free one-page upgrade-risk report # its name, as a draft may say it
  report_contains: [what is at risk on the site, what an upgrade involves] # what it holds; it is theirs to keep
  call_to_action: "Worth 10 minutes to find out?" # the closing question, verbatim
copy:
  banned_words: [synergy, guarantee]
  forbid_by_kind: {d10: ["(?i)migrat"]} # Drupal 10 to 11 is an update, not a migration
  max_words: {0: 120, 1: 80, 3: 60, 4: 60} # step -> most words above the footer
  links_in_step0: false
  exclamation: false
  # Claude drafts only: the grounding check's rules (internal/outreach/ground.go).
  allowed_names: [Drupal, Webbership, Demo, Sender, Harbour Lane Studio] # proper nouns any draft may use; put your own name, company and town here in your data dir
  research_openers: ['(?i)\bI (noticed|saw|came across|was looking at)\b', '(?i)\byour (site|website)\b'] # step 0 never opens with research
  inflation_words: [dozens, hundreds, many clients, countless, leading, top, best, award] # boasts refused outside the proof line
  echo_words: 6 # no run of this many words shared with the org's own text
sequence:
  - {step: 0, type: email}
  - {step: 1, type: email, after_business_days: 3}
  - {step: 2, type: call, after_business_days: 2, when: has_callable_phone}
  - {step: 3, type: email, after_business_days: 1, when: call_not_connected}
  - {step: 4, type: email, after_business_days: 5}
templates_dir: templates # relative to this folder: <kind>/<lang>/{0,1,3,4}.txt and call.txt; a lead whose country needs a call before any email
# (call first) gets <kind>/<lang>/call_first/{2,3}.txt, sent only after they said yes on the call
