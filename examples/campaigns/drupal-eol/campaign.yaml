# A fictional campaign spec for the Drupal end-of-life outreach (leadhound leads campaigns ...).
# Copy examples/campaigns/ into your LEADHOUND_DATA_DIR and make it your own; every value here is a demo.
# The templates are the fallback the template writer sends; your real copy is yours to write and approve.
slug: drupal-eol
name: Drupal end-of-life
product: {name: Drupal upgrades, site_url: "https://sender.example/"}
source: {kind: site_list}
detectors: [drupal@1, agency@1]
kinds: [unsupported, d10, agency_partner]
countries: # country -> policy; a country missing here gets no email and no call
  GB: {email: on, call: on, lang: en}
  IE: {email: on, call: off, lang: en}
  US: {email: on, call: off, lang: en}
  DE: {email: off, call: off}
writer: template # template | claude (claude is refused until the draft gate passes)
offer:
  proof_line: "Recently I took a Drupal 7 site for Harbour Lane Studio to Drupal 10, with no downtime." # one true line, used verbatim
  magnet: upgrade_risk_report # the free one-page upgrade-risk report, offered in step 0 and sent on reply
copy:
  banned_words: [synergy, guarantee]
  forbid_by_kind: {d10: ["(?i)migrat"]} # Drupal 10 to 11 is an update, not a migration
  max_words: {0: 120, 1: 80, 3: 60, 4: 60} # step -> most words above the footer
  links_in_step0: false
  exclamation: false
sequence:
  - {step: 0, type: email}
  - {step: 1, type: email, after_business_days: 3}
  - {step: 2, type: call, after_business_days: 2, when: has_callable_phone}
  - {step: 3, type: email, after_business_days: 1, when: call_not_connected}
  - {step: 4, type: email, after_business_days: 5}
templates_dir: templates # relative to this folder: <kind>/<lang>/{0,1,3,4}.txt and call.txt
