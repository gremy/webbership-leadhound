# A fictional leads policy for the Drupal-site outreach (leadhound leads ...).
# Copy examples/ into your LEADHOUND_DATA_DIR and make it your own; every value here is a demo.
site_lists:
  tlds: [uk, ie, nl, be, ro, de, at, ch] # registrable-domain suffixes kept on import
probe:
  reprobe_after_days: 30
public_body_suffixes: [ac.uk, gov.uk, nhs.uk, police.uk, sch.uk, gov.ro, gov.ie, overheid.nl] # demo values
role_local_parts: [office, contact, info, hello, enquiries, enquiry, web, webmaster, digital, admin, secretariat, kontakt, contacto, contactt] # demo values
countries: # country -> policy; a country missing here means channel none
  GB: {channel: email, lang: en, tz: Europe/London, footer: footer-en}
  DE: {channel: form, lang: en, tz: Europe/Berlin}
agency_finding_pattern: '(?i)drupal\s*(7|8|9|10|11)|upgrade|migrat'
sender:
  name: "Demo Sender"
  identity_line: "Demo Ltd, 1 Example Street, Example City"
  dkim_selector: sel1 # the DKIM selector (the name before ._domainkey) for a mailbox added without a preset or its own
  operator_addresses: [operator@sender.example]
  site_url: https://sender.example/
  opt_out_lines: # language -> the opt-out line; every language an email country uses needs one
    en: "Not the right time? Reply \"unsubscribe\" and I will not write to you again."
facts: {d6_eol: 2016-02-24, d7_eol: 2025-01-05, d8_eol: 2021-11-17, d9_eol: 2023-11-01, d10_eol: 2026-12-09} # dates the templates may state
templates_dir: leads-templates # relative to the data dir
kinds_priority: [agency_partner, unsupported, d10]
kinds_off: [] # kinds left out of the queue and of new batches: any of unsupported, d10, agency_partner
skip_rank_over: 0 # skip very small sites: 0 is off; else a site lead ranked above this, or unranked, leaves the queue (it stays in the list)
batches_from: starred # starred (the default when left out): batch new drafts starred leads only; starred_then_rest: then the rest of the queue
relevance:
  rating: true # Jev rates each lead's relevance; on when left out
  leads_daily_calls: 0 # the most rating calls a day; 0 uses LEADHOUND_JEV_LEADS_DAILY_CALL_CAP, and a value can lower that cap, never raise it
priority: # the order batches draw leads in: highest score first; points are -100 to 100
  kinds: {unsupported: 20, d10: 10, agency_partner: 15} # replaces kinds_priority's order when present
  majors: {6: 5, 7: 30, 8: 20, 9: 15, 10: 10} # Drupal major -> points
  channels: {email: 10, form: 0}
  rank_bands: [{under: 10000, points: 15}, {under: 100000, points: 8}] # the first band a site's list rank is under
  exact_version: 5 # the exact version is known
  countries: {} # ISO code -> points; unlisted 0
  exclude_countries: [] # never offered, whatever the country policy says
copy: {first_words: [90, 120], followup_words: [70, 80], banned_words: [synergy, guarantee]}
schedule:
  business_hours: {start: "09:30", end: "16:30", days: [Mon, Tue, Wed, Thu, Fri]}
  followup_business_days: [4, 7] # step 1 after step 0, step 2 after step 1
  spacing_minutes: [3, 9]
caps:
  start_date: 2026-11-16
  ramp: [{from_day: 0, per_day: 5}, {from_day: 7, per_day: 12}, {from_day: 14, per_day: 25}] # per mailbox (at most 40); with start_date: first-send, from each mailbox's own first send
  batch_size: 10
  domain_per_day: 50 # live sends per sending domain per day, over all its mailboxes (at most 100)
  mailboxes_per_domain: 2 # mailboxes the operator may add on one sending domain (at most 5)
health:
  bounce_pause: {bounces: 2, within_sends: 50} # a mailbox pauses itself at this many hard bounces in its last N live sends
